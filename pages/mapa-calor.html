<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mapa de Calor — Vacantes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="icon" type="image/png" href="../assets/images/turtle-circle-logo.png"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:#F5F7FB;
    --navy:#071B34;
    --navy-mid:#0D2748;
    --electric:#2563EB;
    --text:#0F172A;
    --text-mid:#475569;
    --text-soft:#94A3B8;
    --white:#FFFFFF;
    --border:#E2E8F0;
    --shadow-sm:0 1px 4px rgba(0,0,0,.06);
    --shadow-md:0 4px 20px rgba(0,0,0,.08);
    --radius:20px;
    --radius-sm:12px;
    --sidebar-w:220px;
  }
  html, body { height: 100%; font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); }

  .layout { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w); background: linear-gradient(160deg, var(--navy) 0%, var(--navy-mid) 60%, #0B2340 100%); flex-shrink: 0;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .sidebar-brand {
    padding: 28px 20px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    text-align: center;
  }
  .brand-logo { width:48px; height:48px; object-fit:contain; }
  .brand-name { color: var(--white); font-size: .95rem; font-weight: 700; line-height: 1.3; }
  .brand-sub  { color: rgba(255,255,255,0.45); font-size: .72rem; margin-top: 2px; }
  nav { display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; border-radius: var(--radius-sm);
    color: rgba(255,255,255,0.55); font-size: .88rem; font-weight: 500;
    cursor: pointer; text-decoration: none;
    transition: all .2s ease;
  }
  .nav-item:hover  { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.9); }
  .nav-item.active { background: var(--electric); color: var(--white); box-shadow: 0 4px 20px rgba(37,99,235,.35); }
  .nav-item svg    { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-footer { display:flex; align-items:center; gap:8px; padding:20px 18px; border-top:1px solid rgba(255,255,255,.07); color:rgba(255,255,255,.3); font-size:.72rem; }
  .sidebar-footer svg { width:16px; height:16px; flex-shrink:0; }

  /* ── Main ── */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    background: var(--white); padding: 20px 36px;
    border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-shrink: 0;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap;
  }
  .topbar-left {}
  .page-label { font-size: .78rem; color: var(--electric); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; }
  .page-title { font-size: 1.85rem; font-weight: 700; color: var(--navy); letter-spacing: -.03em; line-height: 1.1; margin: 4px 0 12px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    padding: 7px 14px; border-radius: 99px; font-size: .8rem; font-weight: 700;
    border: 1px solid var(--border); background: var(--white);
    cursor: pointer; color: var(--text-mid); transition: all .15s;
  }
  .pill:hover  { border-color: var(--electric); color: var(--electric); }
  .pill.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

  .badge-update {
    font-size: .78rem; color: var(--text-mid); white-space: nowrap;
    display: flex; align-items: center; gap: 7px; margin-top: 4px;
    background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 14px; box-shadow: var(--shadow-sm);
  }
  .badge-update span { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; display: inline-block; }

  /* ── Map ── */
  .map-shell {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #map {
    flex: 1;
    min-height: 420px;
    width: 100%;
  }
